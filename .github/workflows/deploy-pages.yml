name: Test and deploy Reverse Planner

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main, feature/soft-pixel-v02-20261017]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify scripts and planning data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app syntax
        run: node --check assets/app.js
      - name: Run all tests
        run: node --test tests/*.test.mjs
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install Japanese fonts for visual checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - name: Run Chromium browser smoke tests
        run: node tests/browser-smoke.mjs
      - name: Upload UI screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-ui-screenshots
          path: test-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify static references
        run: |
          test -s index.html
          test -s assets/app.css
          test -s assets/app.js
          test -s assets/core.mjs
          test -s assets/state.mjs


  mobile-review:
    name: Publish smartphone-viewable review images
    needs: [test]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/approved-brand-integration-20261018'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: app004-mobile-screenshots
      cancel-in-progress: false
    steps:
      - name: Check out safe reference for independent preview branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Download synthetic CI screenshots
        uses: actions/download-artifact@v4
        with:
          name: v02-ui-screenshots
          path: /tmp/app004-mobile-ci-screens
      - name: Update isolated public review image branch
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/remotes/origin/preview/app004-mobile; then
            git switch -C preview/app004-mobile origin/preview/app004-mobile
          else
            git switch -c preview/app004-mobile
          fi
          mkdir -p docs/review/screenshots
          for file in home-390.png setup-mobile.png clock-plan-mobile.png timer-mobile.png done-mobile.png home-text200-390.png setup-text200-320.png plan-text200-320.png run-text200-320.png; do
            test -s "/tmp/app004-mobile-ci-screens/$file"
            cp "/tmp/app004-mobile-ci-screens/$file" "docs/review/screenshots/$file"
          done
          cat > docs/review/screenshots/README.md <<'REVIEW'
          # APP-004 Mobile screenshots

          These screenshots are generated by GitHub Actions from synthetic demo tasks.
          They are **Chromium 320/390px viewport captures, not photographs or validation of iPhone Safari**.
          They are published to the independent preview/app004-mobile branch and are not production Pages assets.
          The original adopted logo artwork is not included until the user-supplied source is confirmed.

          - home-390.png: home
          - setup-mobile.png: setup
          - clock-plan-mobile.png: result/plan
          - timer-mobile.png: running timer
          - done-mobile.png: task completion
          - *-text200-*.png: automated text enlargement preview, not native Safari zoom

          REVIEW
          printf '\nSource PR code commit: %s\n' "$SOURCE_SHA" >> docs/review/screenshots/README.md
          git add docs/review/screenshots
          if git diff --cached --quiet; then
            echo 'No changes to published screenshots.'
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs(review): refresh APP-004 smartphone screenshots"
          git push origin HEAD:refs/heads/preview/app004-mobile


  deploy:
    name: Publish GitHub Pages
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html _site/
          cp assets/app.css assets/app.js assets/core.mjs assets/state.mjs _site/assets/
          cp -R assets/brand _site/assets/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/state.mjs
          test -s _site/assets/brand/brand.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
