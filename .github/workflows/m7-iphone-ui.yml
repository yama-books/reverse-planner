name: APP-004 M7 mobile UI review
on:
  push:
    branches: ['feature/m7-iphone-ui-20261023']
    paths: ['assets/**', 'index.html', 'tests/**', '.github/workflows/m7-iphone-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast-state-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Node state and syntax
        run: |
          node --check assets/app.js
          node --test tests/*.test.mjs
  mobile-review:
    needs: fast-state-regression
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers without the slow Ubuntu apt dependency sweep
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install chromium webkit
      - name: Syntax and state regressions
        run: |
          node --check assets/app.js
          node --test tests/*.test.mjs
      - name: Existing browser regressions
        run: |
          node tests/browser-smoke.mjs
          node tests/m4-webkit-mobile.mjs
          node tests/m5-image-review.mjs
          M5_BROWSER=webkit node tests/m5-image-review.mjs
      - name: M7 before and after screenshots and behavior
        run: |
          M7_BEFORE=1 node tests/m7-iphone-ui.mjs
          node tests/m7-iphone-ui.mjs
          M7_BROWSER=chromium node tests/m7-iphone-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app004-m7-mobile-review
          path: test-screenshots/
          retention-days: 14
